name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: python -m build

      - name: Test
        run: pytest

      - name: Lint
        run: 

      - name: Pray
        run: echo "praise the lord"
